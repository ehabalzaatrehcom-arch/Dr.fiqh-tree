<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخطة الشجرية لتخصص الفقه وأصوله - جامعة عمان العربية</title>
    
    <!-- إعدادات تطبيق الهاتف PWA -->
    <meta name="theme-color" content="#0284c7">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="خطة الفقه">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-page: #f1f5f9;
            --wrapper-bg: #ffffff;
            --text-main: #0f172a;
            --section-bg: #f8fafc;
            --border-color: #e2e8f0;
            --card-bg: #f0fdfa;
            --card-border: #99f6e4;
            
            --btn-unified-bg: #0284c7;
            --btn-unified-hover: #0369a1;

            --box-root: #e0f2fe;
            --border-root: #0284c7;
            --text-root: #0369a1;

            --box-mandatory: #f0fdf4;
            --border-mandatory: #86efac;
            --text-mandatory: #166534;

            --box-optional: #fefce8;
            --border-optional: #fde047;
            --text-optional: #854d0e;

            --box-free: #f8fafc;
            --border-free: #cbd5e1;
            --text-free: #334155;

            --done-root-bg: #0369a1;
            --done-root-border: #075985;
            --done-mand-bg: #15803d;
            --done-mand-border: #166534;
            --done-opt-bg: #b45309;
            --done-opt-border: #92400e;
            --done-free-bg: #334155;
            --done-free-border: #1e293b;
            
            --arrow-stroke: #10b981;
        }

        body.dark-mode {
            --bg-page: #0f172a;
            --wrapper-bg: #1e293b;
            --text-main: #f8fafc;
            --section-bg: #0f172a;
            --border-color: #334155;
            --card-bg: #132e35;
            --card-border: #115e59;

            --btn-unified-bg: #0284c7;
            --btn-unified-hover: #38bdf8;

            --box-root: #0c4a6e;
            --border-root: #38bdf8;
            --text-root: #e0f2fe;

            --box-mandatory: #14532d;
            --border-mandatory: #4ade80;
            --text-mandatory: #f0fdf4;

            --box-optional: #713f12;
            --border-optional: #facc15;
            --text-optional: #fefce8;

            --box-free: #1e293b;
            --border-free: #475569;
            --text-free: #e2e8f0;

            --arrow-stroke: #34d399;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Tajawal', 'Cairo', Tahoma, sans-serif !important; 
            -webkit-print-color-adjust: exact !important; 
            print-color-adjust: exact !important; 
        }

        body { 
            background-color: var(--bg-page); 
            padding: 12px; 
            color: var(--text-main); 
            direction: rtl; 
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        .toolbar {
            max-width: 1100px;
            margin: 0 auto 12px auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toolbar-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .buttons-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            width: 100%;
        }

        .btn {
            border: none;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(2, 132, 199, 0.15);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--btn-unified-bg);
            color: #ffffff;
        }

        .btn:hover {
            transform: translateY(-1px);
            background: var(--btn-unified-hover);
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.25);
        }

        .btn.active-filter {
            background: #0369a1 !important;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.35) !important;
        }

        .btn-in-search {
            height: 42px;
            padding: 0 16px;
            border-radius: 12px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .btn-reset-red {
            background: #ef4444 !important;
            color: #ffffff !important;
            border: 1.5px solid #dc2626 !important;
            font-weight: 800 !important;
            height: 42px;
            padding: 0 18px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(239, 68, 68, 0.2) !important;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .btn-reset-red:hover {
            background: #dc2626 !important;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.35) !important;
        }

        .stats-summary-card {
            background: var(--wrapper-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 800;
        }

        .stat-badge-total {
            background: #dcfce7;
            color: #15803d;
            font-size: 19px;
            padding: 3px 12px;
            border-radius: 8px;
            font-weight: 900;
        }

        body.dark-mode .stat-badge-total {
            background: #14532d;
            color: #4ade80;
        }

        /* صف شريط البحث وزر المتاح وزر مسح التحديد */
        .search-action-fullrow {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .search-box-wrap {
            position: relative;
            flex: 1;
        }

        .search-input {
            width: 100%;
            height: 42px;
            padding: 7px 16px 7px 34px;
            border-radius: 12px;
            border: 1.5px solid var(--border-color);
            background: var(--wrapper-bg);
            color: var(--text-main);
            font-size: 13.5px;
            font-weight: 700;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: #0284c7;
        }

        .wrapper { 
            max-width: 1100px; 
            margin: 0 auto; 
            background: var(--wrapper-bg) !important; 
            border: 1.5px solid var(--border-color); 
            border-radius: 14px; 
            padding: 16px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            transition: background 0.3s ease;
        }
        
        .header { 
            text-align: center;
            margin-bottom: 14px; 
            border-bottom: 1.5px solid var(--border-color); 
            padding-bottom: 12px; 
        }

        .header h1 { 
            font-size: 25px; 
            color: var(--text-main); 
            font-weight: 900;
        }

        .header p { 
            font-size: 14px; 
            color: #0284c7; 
            font-weight: 800; 
            margin-top: 4px; 
        }

        .section { 
            background: var(--section-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 10px; 
            padding: 12px; 
            margin-bottom: 12px; 
        }

        .card { 
            background: var(--card-bg) !important; 
            border: 1.5px solid var(--card-border) !important; 
            border-radius: 8px; 
            padding: 8px; 
        }

        .box { 
            border-radius: 6px; 
            padding: 6px 8px; 
            font-size: 12px; 
            font-weight: 700; 
            min-height: 38px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            line-height: 1.25; 
            gap: 6px;
            transition: all 0.22s ease;
            user-select: none;
            cursor: pointer;
            position: relative;
        }

        .box.root-course { background: var(--box-root); border: 1.8px solid var(--border-root); color: var(--text-root); font-size: 13px; font-weight: 800; width: 100%; }
        .box.mand-course { background: var(--box-mandatory); border: 1.5px solid var(--border-mandatory); color: var(--text-mandatory); }
        .box.opt-course { background: var(--box-optional); border: 1.5px dashed var(--border-optional); color: var(--text-optional); }
        .box.free-course { background: var(--box-free); border: 1.2px solid var(--border-free); color: var(--text-free); font-size: 11.5px; }
        .box.free-opt-course { background: var(--box-optional); border: 1.5px dashed var(--border-optional); color: var(--text-optional); font-size: 11.5px; }

        .box.root-course.completed { background: var(--done-root-bg) !important; border-color: var(--done-root-border) !important; color: #ffffff !important; }
        .box.mand-course.completed { background: var(--done-mand-bg) !important; border-color: var(--done-mand-border) !important; color: #ffffff !important; }
        .box.opt-course.completed, .box.free-opt-course.completed { background: var(--done-opt-bg) !important; border-color: var(--done-opt-border) !important; color: #ffffff !important; }
        .box.free-course.completed { background: var(--done-free-bg) !important; border-color: var(--done-free-border) !important; color: #ffffff !important; }

        .box.dimmed-unavailable, .box.search-dimmed {
            opacity: 0.18 !important;
            filter: grayscale(85%) !important;
            pointer-events: none !important;
            cursor: not-allowed !important;
        }

        .box.search-matched { outline: 2.5px solid #0284c7; transform: scale(1.02); z-index: 10; }
